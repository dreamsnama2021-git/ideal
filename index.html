<!DOCTYPE html>
<html lang="en">
<head>
  <!-- Basic -->
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  />

  <!-- Primary SEO -->
  <title>Ideal Group Of Companies</title>
  <meta
    name="description"
    content="Ideal Group Of Companies - Premium construction, infrastructure and real estate solutions."
  />
  <meta
    name="keywords"
    content="Ideal Group Of Companies, Construction, Builders, Infrastructure, Real Estate"
  />
  <meta name="author" content="Ideal Group Of Companies" />
  <meta name="robots" content="index, follow" />
  <meta name="theme-color" content="#ffffff" />

  <!-- Canonical -->
  <link
    rel="canonical"
    href="https://idealgroupofcompanies.in/"
  />

  <!-- Favicon -->
  <!-- Place these files inside your public folder -->
  <link rel="icon" href="/favicon.ico" sizes="any" />
  <link
    rel="icon"
    type="image/png"
    sizes="32x32"
    href="/favicon-32x32.png"
  />
  <link
    rel="icon"
    type="image/png"
    sizes="16x16"
    href="/favicon-16x16.png"
  />
  <link
    rel="apple-touch-icon"
    sizes="180x180"
    href="/apple-touch-icon.png"
  />

  <!-- Optional -->
  <link rel="manifest" href="/site.webmanifest" />

  <!-- Open Graph -->
  <meta property="og:type" content="website" />
  <meta property="og:title" content="Ideal Group Of Companies" />
  <meta
    property="og:description"
    content="Premium construction, infrastructure and real estate solutions."
  />
  <meta
    property="og:url"
    content="https://idealgroupofcompanies.in/"
  />
  <meta
    property="og:image"
    content="https://idealgroupofcompanies.in/og-image.jpg"
  />

  <!-- Twitter -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Ideal Group Of Companies" />
  <meta
    name="twitter:description"
    content="Premium construction, infrastructure and real estate solutions."
  />
  <meta
    name="twitter:image"
    content="https://idealgroupofcompanies.in/og-image.jpg"
  />

  <!-- Fonts -->
  <link
    rel="preconnect"
    href="https://fonts.googleapis.com"
  />
  <link
    rel="preconnect"
    href="https://fonts.gstatic.com"
    crossorigin
  />
  <link
    href="https://fonts.googleapis.com/css2?family=Albert+Sans:wght@400;500;600;700;800&display=swap"
    rel="stylesheet"
  />

  <!-- Font Awesome -->
  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
  />
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
